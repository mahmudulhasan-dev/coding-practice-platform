{% extends "base.html" %}

{% block title %}{{ lesson.title }}{% endblock %}

{% block extra_head %}
  {% if lesson.is_approved %}
    <meta name="robots" content="index, follow">
  {% else %}
    <meta name="robots" content="noindex, nofollow">
  {% endif %}
{% endblock %}

{% block content %}
  <div class="container mt-4">
    <article>
      <h1>{{ lesson.title }}</h1>
      {{ lesson.content|safe }}
    </article>
  </div>
{% endblock %}
