{% extends "base.html" %}

{% block title %}Lessons{% endblock %}

{% block content %}
  <div class="container mt-4">
    <h1>Lessons</h1>
    <ul class="list-unstyled">
      {% for lesson in lessons %}
        <li><a href="{{ lesson.get_absolute_url }}">{{ lesson.title }}</a></li>
      {% endfor %}
    </ul>
  </div>
{% endblock %}
